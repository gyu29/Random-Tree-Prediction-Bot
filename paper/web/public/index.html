<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gene Yu</title>
<meta name="description" content="Research and projects by Gene Yu.">
<meta name="author" content="Gene Yu">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<script>
(function () {
  try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F4F4EE;
  --surface: #FFFFFF;
  --surface-2: #E9EAE2;
  --text: #15190F;
  --text-soft: #4A5146;
  --text-faint: #7E8579;
  --border: #D6D8CC;
  --signal: #0E7A70;
  --signal-soft: #E0EEE9;
  --serif: "Spectral", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1210;
    --surface: #151B17;
    --surface-2: #1D241E;
    --text: #E8EBE2;
    --text-soft: #A0A89B;
    --text-faint: #69725F;
    --border: #2A3329;
    --signal: #4CC9BB;
    --signal-soft: #15302C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1210;
  --surface: #151B17;
  --surface-2: #1D241E;
  --text: #E8EBE2;
  --text-soft: #A0A89B;
  --text-faint: #69725F;
  --border: #2A3329;
  --signal: #4CC9BB;
  --signal-soft: #15302C;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; display: flex; flex-direction: column;
  background: var(--paper); color: var(--text);
  font-family: var(--sans); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--signal-soft); color: var(--text); }
a { color: inherit; }
.wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 16px; }

.theme {
  position: fixed; top: 14px; right: 16px; z-index: 10;
  width: 36px; height: 36px; padding: 0; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-soft);
  display: grid; place-items: center; transition: border-color .15s, color .15s;
}
.theme:hover { color: var(--signal); border-color: var(--signal); }
.theme svg { width: 17px; height: 17px; display: none; }
.theme[data-mode="auto"] .i-auto, .theme[data-mode="light"] .i-light, .theme[data-mode="dark"] .i-dark { display: block; }

header { padding: 120px 0 48px; }
.kicker {
  margin: 0 0 14px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--signal);
}
h1 {
  margin: 0; font-family: var(--serif); font-weight: 700;
  font-size: clamp(44px, 8vw, 72px); line-height: 1; letter-spacing: -.015em;
}

main { flex: 1; padding-bottom: 96px; }
h2 {
  margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
  font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint);
}
.works { list-style: none; margin: 0; padding: 0; }
.work {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 24px; align-items: center;
  padding: 22px 0; border-bottom: 1px solid var(--border);
}
.work .meta { font-size: 13.5px; color: var(--text-faint); margin: 0 0 4px; }
.work .meta span + span::before { content: "\00b7"; margin: 0 8px; }
.work h3 {
  margin: 0; font-family: var(--serif); font-weight: 600;
  font-size: 24px; line-height: 1.25; letter-spacing: -.005em; text-wrap: balance;
}
.work h3 a { text-decoration: none; }
.work h3 a:hover { color: var(--signal); }
.links { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  font-size: 14px; font-weight: 500; text-decoration: none;
  padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  transition: border-color .15s, color .15s, background .15s;
}
.btn:hover { border-color: var(--signal); color: var(--signal); }
.btn svg { width: 14px; height: 14px; }
@media (max-width: 600px) {
  header { padding: 88px 0 36px; }
  .work { grid-template-columns: minmax(0, 1fr); }
  .work h3 { font-size: 21px; }
}

footer { padding: 28px 0 40px; border-top: 1px solid var(--border); font-size: 13.5px; color: var(--text-faint); }
</style>
</head>
<body>

<button class="theme" id="theme-toggle" type="button" data-mode="auto" aria-label="Colour theme">
  <svg class="i-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
  <svg class="i-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
  <svg class="i-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
</button>

<header>
  <div class="wrap">
    <p class="kicker">Works</p>
    <h1>Gene Yu</h1>
  </div>
</header>

<main>
  <div class="wrap">
    <section aria-labelledby="research">
      <h2 id="research">Research</h2>
      <ul class="works">
        <li class="work">
          <div>
            <p class="meta"><span>Research paper</span><span>September 2026</span></p>
            <h3><a href="paper.pdf">How Much Evidence Does a Backtest Really Have?</a></h3>
          </div>
          <div class="links">
            <a class="btn" href="paper.pdf">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>
              PDF
            </a>
            <a class="btn" href="https://github.com/gyu29/Random-Tree-Prediction-Bot" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>
              Code on GitHub
            </a>
          </div>
        </li>
      </ul>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">Gene Yu · 2026</div>
</footer>

<script>
(function () {
  var root = document.documentElement, btn = document.getElementById('theme-toggle');
  var THEMES = ['auto', 'light', 'dark'];
  function theme() { return root.getAttribute('data-theme') || 'auto'; }
  function set(t) {
    if (t === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
    try { if (t === 'auto') localStorage.removeItem('theme'); else localStorage.setItem('theme', t); } catch (e) {}
    btn.setAttribute('data-mode', t);
    btn.setAttribute('aria-label', 'Colour theme: ' + t + '. Click to change.');
    btn.title = 'Theme: ' + t;
  }
  set(theme());
  btn.addEventListener('click', function () { set(THEMES[(THEMES.indexOf(theme()) + 1) % THEMES.length]); });
})();
</script>
</body>
</html>
